name: Leaderboard

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'high-score')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruff tweepy

      - name: Run verifier
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: python scripts/update_leaderboard.py

      - name: Commit & push leaderboard
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "cellsmith-bot"
            git config user.email "actions@github.com"
            git add leaderboard.json README.md
            git commit -m "leaderboard: process #${{ github.event.issue.number }} [skip ci]"
            git push
          fi

      - name: Post to X (soft-fail)
        if: success()
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/post_to_x.py

      - name: Comment & close on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const msg = fs.existsSync('action_message.txt')
              ? fs.readFileSync('action_message.txt', 'utf8')
              : '✅ Submission processed.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: msg,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });

      - name: Comment & close on rejection
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const msg = fs.existsSync('action_message.txt')
              ? fs.readFileSync('action_message.txt', 'utf8')
              : '❌ Submission rejected. See Action logs for details.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: msg,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
