name: "🏆 Submit High Score"
description: Submit a CellSmith patch session to the leaderboard.
title: "[score] <model> — <session-summary>"
labels: ["high-score"]
body:
  - type: markdown
    attributes:
      value: |
        Paste the **entire JSON patch payload** your LLM produced (the same file
        you fed to `cellsmith patch`). The Action will iterate every revision,
        re-run `ast.walk` on each `code_content`, run `ruff check` on each one,
        and sum a weighted score for the whole session. You'll get tallies of
        how many `CELL_PATCH` / `CELL_CREATE` / `REPLACE` ops your LLM landed.

  - type: input
    id: handle
    attributes:
      label: Display name
      description: How you want to appear on the leaderboard.
      placeholder: e.g. cool-prompt-wizard
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model
      description: The LLM you used (honor system).
      placeholder: e.g. qwen-3.9-4b
    validations:
      required: true

  - type: input
    id: engine
    attributes:
      label: Engine
      description: Inference engine / runner.
      placeholder: e.g. mlx, llama.cpp, vLLM, anthropic-api
    validations:
      required: true

  - type: textarea
    id: payload
    attributes:
      label: JSON patch payload
      description: The full payload — must contain a `revisions` array (and optionally `artifacts`).
      render: json
      placeholder: |
        {
          "revisions": [
            {"filename": "foo.py", "revision_type": "CELL_PATCH", "cell_id": "func:bar", "code_content": "..."},
            {"filename": "foo.py", "revision_type": "CELL_CREATE", "code_content": "..."}
          ]
        }
    validations:
      required: true

  - type: textarea
    id: prompt_notes
    attributes:
      label: Prompt notes (optional)
      description: Brag about the prompt strategy / context window / setup.
    validations:
      required: false
