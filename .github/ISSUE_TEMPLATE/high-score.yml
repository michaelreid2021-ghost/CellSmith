name: "🏆 Submit High Score"
description: Submit a CellSmith patch session to the leaderboard.
title: "[score] <model> — <session-summary>"
labels: ["high-score"]
body:
  - type: markdown
    attributes:
      value: |
        Run `cellsmith submit your_patch.json --context your_source/` and it
        fills this form automatically. Just hit Submit.

  - type: input
    id: handle
    attributes:
      label: Display name
      description: How you want to appear on the leaderboard.
      placeholder: e.g. cool-prompt-wizard
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model
      description: The LLM you used (honor system).
      placeholder: e.g. gemma-3-4b
    validations:
      required: true

  - type: input
    id: engine
    attributes:
      label: Engine
      description: Inference engine / runner.
      placeholder: e.g. mlx, llama.cpp, vLLM, anthropic-api
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Model size category (self-declared, honor system)
      options:
        - "<4B"
        - "<10B"
        - "<30B"
        - "frontier"
        - "unknown"
      default: 4
    validations:
      required: true

  - type: input
    id: score
    attributes:
      label: Score
      description: Computed locally by cellsmith submit.
      placeholder: e.g. 3847.5
    validations:
      required: true

  - type: input
    id: nodes
    attributes:
      label: Output nodes
      description: Total AST nodes across all revised cells.
      placeholder: e.g. 2565
    validations:
      required: true

  - type: input
    id: input_chars
    attributes:
      label: Input context size (characters)
      description: Total chars of source you handed the LLM. Counted locally by cellsmith submit.
      placeholder: e.g. 18432
    validations:
      required: true

  - type: input
    id: patches
    attributes:
      label: CELL_PATCH count
      placeholder: e.g. 9
    validations:
      required: true

  - type: input
    id: creates
    attributes:
      label: CELL_CREATE count
      placeholder: e.g. 2
    validations:
      required: true

  - type: input
    id: replaces
    attributes:
      label: REPLACE count
      placeholder: e.g. 1
    validations:
      required: true

  - type: input
    id: revisions
    attributes:
      label: Total revisions
      placeholder: e.g. 12
    validations:
      required: true

  - type: dropdown
    id: lint_passed
    attributes:
      label: Ruff lint passed (local check)
      description: cellsmith submit runs ruff on your patched files and fills this in.
      options:
        - "yes"
        - "no"
      default: 0
    validations:
      required: true

  - type: textarea
    id: prompt_notes
    attributes:
      label: Prompt notes (optional)
      description: Brag about your prompt strategy / setup.
    validations:
      required: false
