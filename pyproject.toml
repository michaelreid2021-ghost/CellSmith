[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cellsmith"
version = "0.1.0"
description = "AST-based cell-aware code patcher for LLM-driven Python edits, with a passive scoring system."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Michael Reid" }]
keywords = ["llm", "ast", "patch", "code-editing", "cells"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
cellsmith = "cellsmith.markup:main"

[project.urls]
Repository = "https://github.com/michaelreid2021-ghost/CellSmith"

[tool.hatch.build.targets.wheel]
packages = ["src/cellsmith"]
